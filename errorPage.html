<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>E-Consent : Error</title>
  <link rel="stylesheet" href="src/style/main.css">
</head>

<body>
  <div class="app-container">
    <div class="error-page-content">
      <div class="error-image">
        <img src="src/assets/images/oops.svg" />
      </div>
      <div class="error-content">
        <div class="error-code">404</div>
        <div class="error-detail">
          UH OH! You're lost.
          The page you are looking for does not exist. How you got here is a mystery. But you can click the button below
          to go back to the homepage
        </div>
        <div class="error-page-control">
          <button class="btn --primary --lg">Home</button>
          <button class="btn --primary --lg">Back</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
