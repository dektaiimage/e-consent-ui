<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>E-Consent : Manage Form</title>
  <link rel="stylesheet" href="src/style/main.css">
  <link rel="stylesheet" href="src/style/template.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="app-logo">
        <img src="src/assets/images/logoApp.svg" />
      </div>
      <nav class="app-menu">
        <a class="menu-item" href="index.html"><i class="material-symbols-outlined">contract</i>
          <label>History</label>
        </a>
        <a class="menu-item --active" href="template.html"><i class="material-symbols-outlined">cards_star</i>
          <label>Template</label>
        </a>
        <!-- <a>บันทึก</a> -->
      </nav>
      <a class="menu-item logout-action" href="login.html">
        <i class="material-symbols-outlined">logout</i>
        <label>logout</label>
      </a>
    </header>
    <nav class="nav-page">
      <a class="nav-page-item">Form list</a>/
      <a class="nav-page-item --current">Manage Form</a>
    </nav>
    <div class="app-content">
      <form class="form-content">
        <div class="form-item --vertical">
          <label>ชื่อเอกสาร</label>
          <input class="" type="text" />
        </div>
        <div class="form-item --vertical">
          <label>รายละเอียด</label>
          <textarea rows="5"></textarea>
        </div>
        <div class="row">
          <div class="form-item --vertical" style="flex: 1;">
            <label>รหัสเอกสาร</label>
            <input class="" type="text" />
          </div>
          <div class="form-item --vertical">
            ชั้นความลับ
            <select>
              <option>ชั้นความลับ 1</option>
              <option>ชั้นความลับ 2</option>
              <option>ชั้นความลับ 3</option>
              <option>ชั้นความลับ 4</option>
            </select>
          </div>
        </div>
        <div class="form-item --vertical">
          <label>สิทธิ์ผู้ใช้งาน</label>
          <input class="" type="text" />
        </div>
        <div class="form-item --vertical">
          <label>สิทธิ์ผู้ใช้งานตามตำแหน่ง</label>
          <input class="" type="text" />
        </div>
        <div class="form-item --vertical">
          <label>สิทธิ์ผู้ใช้งานตามแผนก</label>
          <input class="" type="text" />
        </div>
        <div class="form-item --vertical">
          <label>สิทธิ์ผู้ใช้งานตามหน่วยงาน</label>
          <input class="" type="text" />
        </div>
        <div class="form-group">
          <input type="hidden" name="topic.id" value="${i.id}" />
          <div class="row --code-label">
            <div class="form-item --vertical">
              <label>หัวข้อ</label>
              <input name="topic.code" value="${i.code}" class="" type="text" placeholder="[CODE]" data-rel-auto-select
                size="6" />
            </div>
            <div class="form-item --vertical">
              <input name="topic.label" value="${i.label}" data-rel-del-key-auto class="" type="text"
                data-rel-auto-select />
            </div>
          </div>
          <div class="form-item --vertical">
            <label>รายละเอียด</label>
            <textarea rows="5"></textarea>
          </div>
          <div class="form-item --vertical">
            รูปแบบคำตอบ
            <select name="topic.type">
              <option value="1" data-choice="">ข้อความ</option>
              <option value="2" data-choice="">บรรยาย</option>
              <option value="3" data-choice="true">เลือกตอบ</option>
              <option value="4" data-choice="true">เลือกตอบแบบย่อ</option>
              <option value="5" data-choice="true">เลือกตอบหลายตัวเลือก</option>
              <option value="6" data-choice="">รูป</option>
            </select>
          </div>
          <div data-pane="topic.choice" data-role="sort" data-sort-items=":not([data-rel-add])"
            class="form-item --vertical ui-sortable">

            <label>ข้อมูลตัวเลือก</label>

            <div class="row --code-label" data-rel-del="" class="ui-sortable-handle">
              <input type="hidden" value="13" data-rel-topic-index="topic.choice" data-rel-topic-name="id"
                class="ui-sortable-handle" style="">
              <div class="form-item --vertical">
                <input type="text" value="1" data-rel-topic-index="topic.choice" data-rel-topic-name="code"
                  placeholder="[CODE]" data-rel-auto-select="" class="ui-sortable-handle">
              </div>
              <div class="form-item --vertical">
                <input type="text" value="1" data-rel-topic-index="topic.choice" data-rel-topic-name="label"
                  data-rel-del-key-auto="" data-rel-auto-select="" class="ui-sortable-handle">
              </div>
            </div>

            <div data-rel-del="" class="ui-sortable-handle">
              <input type="hidden" value="14" data-rel-topic-index="topic.choice" data-rel-topic-name="id"
                class="ui-sortable-handle" style="">
              <input type="text" value="2" data-rel-topic-index="topic.choice" data-rel-topic-name="code"
                placeholder="[CODE]" data-rel-auto-select="" class="ui-sortable-handle">
              <input type="text" value="2" data-rel-topic-index="topic.choice" data-rel-topic-name="label"
                data-rel-del-key-auto="" data-rel-auto-select="" class="ui-sortable-handle">
            </div>



            <div data-rel-del="" class="ui-sortable-handle">
              <input type="hidden" value="12" data-rel-topic-index="topic.choice" data-rel-topic-name="id"
                class="ui-sortable-handle" style="">
              <input type="text" value="3" data-rel-topic-index="topic.choice" data-rel-topic-name="code"
                placeholder="[CODE]" data-rel-auto-select="" class="ui-sortable-handle">
              <input type="text" value="3" data-rel-topic-index="topic.choice" data-rel-topic-name="label"
                data-rel-del-key-auto="" data-rel-auto-select="" class="ui-sortable-handle">
            </div>



            <div data-rel-del="" class="ui-sortable-handle">
              <input type="hidden" value="21" data-rel-topic-index="topic.choice" data-rel-topic-name="id"
                class="ui-sortable-handle" style="">
              <input type="text" value="4" data-rel-topic-index="topic.choice" data-rel-topic-name="code"
                placeholder="[CODE]" data-rel-auto-select="" class="ui-sortable-handle">
              <input type="text" value="4" data-rel-topic-index="topic.choice" data-rel-topic-name="label"
                data-rel-del-key-auto="" data-rel-auto-select="" class="ui-sortable-handle">
            </div>



            <div data-rel-add="">
              <input type="hidden" value="" data-rel-topic-index="topic.choice" data-rel-topic-name="id"
                class="ui-sortable-handle" style="">
              <input type="text" value="" data-rel-topic-index="topic.choice" data-rel-topic-name="code"
                placeholder="[CODE]" data-rel-auto-select="" class="ui-sortable-handle">
              <input type="text" value="" data-rel-topic-index="topic.choice" data-rel-topic-name="label"
                data-rel-del-key-auto="" data-rel-auto-select="" class="ui-sortable-handle">
            </div>

          </div>
        </div>
        <div class="form-group">
          <div class="form-item --vertical">
            <label>หัวข้อ</label>
            <input class="" type="text" />
          </div>
          <div class="form-item --vertical">
            <label>รายละเอียด</label>
            <textarea rows="5"></textarea>
          </div>
          <div class="form-item --vertical">
            รูปแบบคำตอบ
            <select name="topic.type">
              <option value="1" data-choice="">ข้อความ</option>
              <option value="2" data-choice="">บรรยาย</option>
              <option value="3" data-choice="true">เลือกตอบ</option>
              <option value="4" data-choice="true">เลือกตอบแบบย่อ</option>
              <option value="5" data-choice="true">เลือกตอบหลายตัวเลือก</option>
              <option value="6" data-choice="">รูป</option>
            </select>
          </div>
          <div class="form-item --vertical">
            <label>ข้อมูลตัวเลือก</label>
            <input class="" type="text" />
            <input class="" type="text" />
          </div>
        </div>
        <div class="form-item --vertical">
          <label>Jasper file</label>
          <input type="file" id="myfile" name="myfile">
        </div>
        <div class="control-page">
          <button class="btn" type="button" data-rel-back="">ยกเลิก</button>
          <button class="btn" type="reset">คืนค่า</button>
          <button class="btn" type="submit">บันทึก</button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
